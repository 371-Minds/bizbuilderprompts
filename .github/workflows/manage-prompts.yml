name: Manage and Classify Prompts

# This workflow triggers when files are pushed to the 'incoming_prompts/' directory
on:
  push:
    branches: [ "main" ]
    paths:
      - 'incoming_prompts/**'
  workflow_dispatch:

jobs:
  classify_and_organize:
    runs-on: ubuntu-latest
    permissions:
      # Give the workflow permission to commit and push changes back to the repo
      contents: write

    steps:
    - name: Checkout bizbuilderprompts repo
      uses: actions/checkout@v4
      with:
        # We need to fetch the full history to be able to push back
        fetch-depth: 0

    - name: Set up Bun
      uses: oven-sh/setup-bun@v2
      with:
        bun-version: latest

    - name: Install dependencies
      run: bun install

    - name: Build TypeScript
      run: bun run build

    - name: Debug - List repository contents
      run: |
        echo "=== Repository root contents ==="
        ls -la
        echo "=== Incoming prompts directory ==="
        if [ -d "incoming_prompts" ]; then
          ls -la incoming_prompts/
        else
          echo "incoming_prompts directory not found!"
        fi

    - name: Run Prompt Ingestion Agent
      run: |
        echo "Running TypeScript ingestion agent..."
        bun run ingest

    - name: Debug - Check results
      run: |
        echo "=== Category directories after ingestion ==="
        for dir in sales marketing video_prompts image_prompts projects promotion_prompts_examples business_strategy customer_success general; do
          if [ -d "$dir" ]; then
            echo "✅ $dir/ exists with $(ls -1 $dir | wc -l) files"
          fi
        done

    - name: Commit and Push Changes
      run: |
        git config --global user.name 'github-actions[bot]'
        git config --global user.email 'github-actions[bot]@users.noreply.github.com'
        git add .
        # Check if there are any changes to commit
        if git status --porcelain | grep -q .; then
          git commit -m "chore: auto-classify new prompts from incoming_prompts/"
          git push
          echo "✅ Changes committed and pushed"
        else
          echo "ℹ️ No changes to commit."
        fi

    - name: Create workflow summary
      run: |
        echo "## Prompt Classification Results" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### Processing completed for incoming prompts" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY

        # Count files in each category
        for dir in sales marketing video_prompts image_prompts projects promotion_prompts_examples business_strategy customer_success general; do
          if [ -d "$dir" ]; then
            count=$(ls -1 $dir 2>/dev/null | wc -l)
            echo "- **$dir**: $count files" >> $GITHUB_STEP_SUMMARY
          fi
        done

        echo "" >> $GITHUB_STEP_SUMMARY
        echo "Check the repository for newly organized prompts in category folders." >> $GITHUB_STEP_SUMMARY

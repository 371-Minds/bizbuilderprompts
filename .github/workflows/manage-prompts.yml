name: Manage and Classify Prompts

# This workflow triggers when files are pushed to the 'incoming_prompts/' directory
on:
  push:
    branches: [ "main" ]
    paths:
      - 'incoming_prompts/**'
  workflow_dispatch:

jobs:
  classify_and_organize:
    runs-on: ubuntu-latest
    permissions:
      # Give the workflow permission to commit and push changes back to the repo
      contents: write

    steps:
    - name: Checkout bizbuilderprompts repo
      uses: actions/checkout@v4
      with:
        # We need to fetch the full history to be able to push back
        fetch-depth: 0

    - name: Checkout os repo scripts
      uses: actions/checkout@v4
      with:
        repository: 371-Minds/os
        path: ./os-repo
        sparse-checkout: |
          371-os/scripts/

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Debug - List repository contents
      run: |
        echo "=== Repository root contents ==="
        ls -la
        echo "=== OS repo contents ==="
        find ./os-repo -name "*.py" -type f
        echo "=== Incoming prompts directory ==="
        if [ -d "incoming_prompts" ]; then
          ls -la incoming_prompts/
        else
          echo "incoming_prompts directory not found!"
        fi

    - name: Copy and modify classifier script
      run: |
        # Copy the classifier script to the root
        cp ./os-repo/371-os/scripts/prompt_classifier.py ./prompt_classifier.py
        
        # Modify the script to use the correct directory name
        sed -i 's/INCOMING_DIR = "incoming"/INCOMING_DIR = "incoming_prompts"/' prompt_classifier.py
        
        # Make it executable
        chmod +x ./prompt_classifier.py
        
        echo "=== Modified classifier script ==="
        head -20 prompt_classifier.py

    - name: Run Prompt Classifier
      run: |
        echo "Running prompt classifier..."
        python prompt_classifier.py

    - name: Debug - Check results
      run: |
        echo "=== Repository contents after classification ==="
        ls -la
        echo "=== Category directories created ==="
        for dir in sales marketing product customer_success business_strategy general; do
          if [ -d "$dir" ]; then
            echo "✅ $dir/ exists with $(ls -1 $dir | wc -l) files"
            ls -la $dir/
          else
            echo "❌ $dir/ not found"
          fi
        done

    - name: Commit and Push Changes
      run: |
        git config --global user.name 'github-actions[bot]'
        git config --global user.email 'github-actions[bot]@users.noreply.github.com'
        git add .
        # Check if there are any changes to commit
        if git status --porcelain | grep -q .; then
          git commit -m "chore: auto-classify new prompts from incoming_prompts/"
          git push
          echo "✅ Changes committed and pushed"
        else
          echo "ℹ️ No changes to commit."
        fi

    - name: Create workflow summary
      run: |
        echo "## Prompt Classification Results" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### Processing completed for incoming prompts" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        
        # Count files in each category
        for dir in sales marketing product customer_success business_strategy general; do
          if [ -d "$dir" ]; then
            count=$(ls -1 $dir 2>/dev/null | wc -l)
            echo "- **$dir**: $count files" >> $GITHUB_STEP_SUMMARY
          fi
        done
        
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "Check the repository for newly organized prompts in category folders." >> $GITHUB_STEP_SUMMARY